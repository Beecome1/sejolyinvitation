<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generator Link Undangan</title>
    <link rel="icon" type="image/png" href="../src/img/logo-sejoly.PNG" />
    <link rel="stylesheet" href="../src/output.css" />
  </head>
  <body class="bg-slate-100 min-h-screen p-4 flex items-center justify-center">
    <div
      class="w-full max-w-md bg-white rounded-2xl shadow-md p-6 border border-slate-200"
    >
      <h2 class="text-base font-bold text-slate-800 mb-1">
        Generator Link Undangan
      </h2>
      <p class="text-xs text-slate-500 mb-4">
        Buat link khusus tamu dan langsung kirim via WhatsApp.
      </p>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1"
            >Nama Tamu</label
          >
          <input
            type="text"
            id="input-nama-tamu"
            placeholder="Contoh: Budi Santoso"
            class="w-full p-2.5 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-slate-800"
          />
        </div>

        <button
          onclick="generateLink()"
          class="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-semibold text-xs rounded-xl transition"
        >
          Buat Link & Draft WA
        </button>
      </div>

      <!-- Hasil Output -->
      <div
        id="hasil-box"
        class="hidden mt-5 pt-4 border-t border-slate-100 space-y-3"
      >
        <div>
          <label class="block text-[11px] font-semibold text-slate-500 mb-1"
            >Link Undangan</label
          >
          <input
            type="text"
            id="output-link"
            readonly
            class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-mono text-slate-600"
          />
        </div>

        <a
          id="btn-wa"
          target="_blank"
          class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs rounded-xl flex items-center justify-center gap-2 transition"
        >
          <span>Kirim via WhatsApp</span>
        </a>
      </div>
    </div>

    <script>
      function generateLink() {
        const elInput = document.getElementById("input-nama-tamu");
        const elOutput = document.getElementById("output-link");
        const elBtnWa = document.getElementById("btn-wa");
        const elHasilBox = document.getElementById("hasil-box");

        const namaInput = elInput ? elInput.value.trim() : "";
        if (!namaInput) return alert("Silakan masukkan nama tamu!");

        // Ambil URL folder saat ini secara dinamis
        let currentUrl = window.location.href.split("?")[0].split("#")[0];

        // Hapus 'generator.html' dari URL agar mengarah ke root folder pasangan tersebut
        let baseUrl = currentUrl.replace("generator.html", "");

        // Hasil link bersih: https://nikahyuk.com/nama-folder/?to=Nama+Tamu
        const linkLengkap = `${baseUrl}?to=${encodeURIComponent(namaInput)}`;

        if (elOutput) elOutput.value = linkLengkap;

        // Isi Pesan WhatsApp
        const pesanWA = `Halo ${namaInput},\n\nTanpa mengurangi rasa hormat, kami mengundang Anda untuk hadir di acara pernikahan kami.\n\nDetail acara: ${linkLengkap}`;
        if (elBtnWa)
          elBtnWa.href = `https://wa.me/?text=${encodeURIComponent(pesanWA)}`;

        if (elHasilBox) elHasilBox.classList.remove("hidden");
      }
    </script>
  </body>
</html>
